# RUNing HUB 生产环境 Nginx 配置
# 用法：把 你的域名 替换成真实域名，放到 /etc/nginx/conf.d/runhub.conf
# 前端构建产物放到 /var/www/runhub/dist，后端代码放到 /var/www/runhub/backend

server {
    listen 80;
    server_name 你的域名;   # 例如 runhub.example.com

    # 前端静态文件（vite build 产物）
    location / {
        root /var/www/runhub/dist;
        try_files $uri $uri/ /index.html;   # 前端路由 history 模式必须
    }

    # 接口反向代理到 FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 上传的图片/二维码（直接静态提供，不经过 Python）
    location /uploads/ {
        alias /var/www/runhub/backend/uploads/;
        expires 7d;
    }

    # 上传大小限制（与后端 5MB 校验一致）
    client_max_body_size 10m;
}
